name: CI

# Checks on every pull request: `build` installs the backend's requirements,
# imports them and byte-compiles every module (catches a broken Dependabot bump
# or a syntax error before the merge deploys prod); `pytest` runs the backend
# test suite (infra/functions/tests). The job names are the required status
# checks in the `main` ruleset — rename them there too if they change. Runner
# pinned like deploy.yml; never ubuntu-latest.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install backend requirements
        working-directory: infra/functions
        run: pip install -r requirements.txt

      - name: Import the dependencies
        run: python -c "import azure.functions, azure.storage.blob, azure.identity, azure.data.tables, pypdf, reportlab, PIL, pdfminer"

      - name: Byte-compile the backend
        run: python -m compileall -q infra/functions

  pytest:
    name: pytest
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run backend tests
        working-directory: infra/functions
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
